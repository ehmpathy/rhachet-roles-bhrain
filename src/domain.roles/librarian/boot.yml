budget:
  # a cap, not a target: the least multiple of 250 strictly above what the role costs as a seat boots it.
  # that figure, and the halt, come from `rhx git.repo.test --what integration --scope path://roleBootClamps --mode apply`.
  # each rule min carries only its cue; the `knowledge/` concept articles sit at ref, and only
  # their catalog (kno201) boots. never cut a cue to fit. a halt here means a brief grew: tighten
  # its cue rows or move its argument out. the cap is 5_000, the figure the
  # owner set on #692; never raise it past that.
  tokens: 5_000
always:
  briefs:
    say:
      # overview
      - briefs/knowledge/kno201.documents._.kind=catalog.md
      # 601 inventories — the census discipline for concepts whose entries are
      # enumerable. say-level for the two rules: they must fire BEFORE a doc lands,
      # since the repair for a prose list over an enumerable concept is a rewrite,
      # never an edit. the article + guide sit at ref, per the say/ref policy
      - briefs/rule.require.inventory-for-enumerable-concepts.md
      # the coordinate contract binds EVERY itemization — inventory, catalog, and the
      # ejected example alike — so it is named for the act, never for one artifact kind
      - briefs/rule.forbid.itemization-without-coordinates.md
      # the `._.md` half of that name, on its own: whenever a subject splits into
      # subscopes, the summary is the cluster root. say-level for the same reason the
      # bracket rule is — it must fire AT the moment a second file is named, since the
      # repair after the split is a rename plus every reference to the old name
      - briefs/rule.require.summary-at-the-cluster-root.md
      # the WHETHER to that rule's NAME: prefer to eject a sub-claim into a suffixed
      # peer rather than accrete it inline. say-level because it fires WHILE a brief is
      # written — a zoom-in caught at authorship is a new file, where the same zoom-in
      # caught later is an ejection plus every pointer that has to be rewritten
      - briefs/rule.prefer.decompose-a-subject-via-suffixes.md
      # say-level because it must fire AT the moment a file is named. a rule that
      # arrives after the name is chosen meets a librarian who must rename rather
      # than name — and every ref to the old name has already spread
      - briefs/rule.forbid.brackets-in-filenames.md
      # the cluster discipline — one grain per artifact. say-level for the same reason
      # the inventory rules are: the repair for an accreted catalog is an ejection, and
      # a rule that arrives after fifty good edits meets an artifact nobody can use
      - briefs/rule.require.catalog-is-an-index.md
      - briefs/rule.require.rules-are-clusters.md
      # the THIRD axis of that cluster discipline, and the one that decides the boot
      # tier: `rules-are-clusters` splits the class from one occurrence; this splits
      # the CUE from the case for the cue.
      #
      # say-level for the reason it itself states — a cue that must be fetched has
      # already lost the round. it fires WHILE a rule is written, and the repair
      # afterward is an ejection plus a tier change plus every pointer between.
      #
      # 🟡 nitpick severity, and the grade is honest: it is a PLACEMENT call, so a
      # misplacement costs tokens on every boot rather than correctness on any one.
      # the single blocker it names is `rule.require.a-cue-is-not-a-claim`'s, cited.
      - briefs/rule.prefer.rules-that-refout.md
      # the same say/ref split, for a SET rather than one rule: a subdomain too large to
      # boot whole boots as its catalog, members under `not`. say-level because it must
      # fire when a boot spec is written or runs over budget — the moment a librarian
      # would otherwise trim a cue to save tokens a path list had spent
      - briefs/rule.always.boot-an-oversized-subdomain-as-its-catalog.md
    ref:
      # the concept articles — understood, never produced, so one Read away rather than booted
      - briefs/knowledge/kno401.actors.1.role.librarian.kind=article.md
      - briefs/knowledge/kno101.primitives.1.ontology.kind=article.frame.docs_as_materializations.md
      - briefs/knowledge/kno101.primitives.2.rel.many_to_many.kind=article.md
      - briefs/knowledge/kno101.primitives.3.instances.kind=article.md
      - briefs/knowledge/kno101.primitives.4.documents.kind=article.md
      - briefs/knowledge/kno101.primitives.5.concepts.kind=article.md
      - briefs/knowledge/kno301.doc.enbrief.2.articulate.kind=article.md
      - briefs/knowledge/kno301.doc.enbrief.2.catalogize.kind=article.md
      - briefs/knowledge/kno301.doc.enbrief.2.demonstrate.kind=article.md
      # the demo the catalog rule ejected — one occurrence, dated and measured.
      # ref because a reader wants it once, never on every boot
      - briefs/rule.require.catalog-is-an-index.example=declastruct-aws-security-catalog.md
      # 601 inventories — the why + the moves, on demand
      - briefs/knowledge/kno601.inventories._.kind=article.md
      - briefs/howto.curate-an-inventory.md
      # 201 document types
      - briefs/knowledge/kno201.documents._.kind=article.md
      - briefs/knowledge/kno201.documents.articles.kind=article.md
      - briefs/knowledge/kno201.documents.catalogs.kind=article.md
      - briefs/knowledge/kno201.documents.demos.kind=article.md
      - briefs/knowledge/kno201.documents.lessons.kind=article.md
      # 301 compression
      - briefs/knowledge/kno301.doc.compression._.kind=article.md
    not:
      # the rest of knowledge/ (the thinker's shelf, shared by symlink). listed so the
      # <also> fallback does not re-surface each path on every boot; each member stays
      # one Read away by its kno* name. 🟡 `not` outranks say and ref, so each pattern
      # names only unlisted files — a `knowledge/*.md` glob would drop the say entries
      # too. and each avoids the `[kind]` segment, which a glob reads as a char class
      - briefs/knowledge/kno101.*.docs_as_references.md
      - briefs/knowledge/kno301.doc.compression.1.*
      - briefs/knowledge/kno301.doc.compression.2.*
      - briefs/knowledge/kno301.doc.compression.3.*
      - briefs/knowledge/kno301.doc.compression._.*.persp.garden.md
      - briefs/knowledge/kno301.doc.enbrief.1.*
      - briefs/knowledge/kno301.doc.enbrief.2._.*
      - briefs/knowledge/kno301.doc.enbrief.2.*lesson*.md
      - briefs/knowledge/kno301.doc.kernelize.*
      - briefs/knowledge/kno351.*
      - briefs/knowledge/kno401.actors.1.role.author.*
      - briefs/knowledge/kno401.actors.2.*
      - briefs/knowledge/kno501.*
