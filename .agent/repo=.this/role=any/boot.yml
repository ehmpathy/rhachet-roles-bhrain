always:
  briefs:
    say:
      # identity
      - briefs/im_a.bhrain_owl.md
      - briefs/im_an.obsessive_learner.md
      - briefs/define.bhrain-repo-mascot.md

      # core domain concepts
      - briefs/define.passage-statuses.md

      # rules - always active
      - briefs/rule.forbid.duplicate-format-tree-operations.md
      - briefs/rule.forbid.cwd-outside-gitroot.md
      - briefs/rule.forbid.stdout-on-exit-errors.md
      - briefs/rule.forbid.timestamps-in-route-artifacts.md
      - briefs/rule.forbid.unbounded-recursive-globs.md
      - briefs/rule.require.explicit-stdin-flags.md
      - briefs/rule.require.isolated-cli-subpath-exports.md
      - briefs/rule.require.repeatable-for-llm-tests.md
      # say-level: fires the moment a default brain constant is typed. a pinned
      # version strands every lane on the provider's retirement clock
      - briefs/rule.require.versionless-brain-defaults.md
      # say-level: fires at design time, on any gate that takes a target — the
      # target's grain is chosen once, in a line that looks innocuous. a
      # declaration that names a FILE rather than a party violates it
      - briefs/rule.forbid.suppression-of-undeclared-concerns.md
      - briefs/rule.require.stdout-is-treestruct.md
      # say-level: fires at design time, on a line that looks innocuous
      # (`briefs: []`, a conditional block, a section appended at the end) —
      # a rule fetched later meets a layout already shipped. its third
      # obligation covers WHERE a request is steered, not what a prompt says.
      # argument refs out, per rule.prefer.rules-that-refout; only the cue
      # rides say. occurrence record: ...-as-the-cache-anchor.example=the-review-prompt-with-no-pin.md
      # full measurement: research.review-cost-and-cache
      - briefs/rule.require.name-the-shared-prefix-as-the-cache-anchor.md
      # say-level: fires the moment a cost figure is rendered. the two levers
      # multiply into the bill, so a report that carries one argues for the
      # wrong optimization — and the omission is invisible from inside the
      # breadth that omits it. the peer of the cache-anchor rule above: that
      # one governs the cache-rate lever's mechanism, this one governs whether
      # either lever is legible at all
      - briefs/rule.require.report-both-cost-levers-with-trend-and-locus.md
      # say-level: the specialization of the rule above for the moment its readers
      # look past it — a reviewer overflowed and a driver must decide what to cut.
      # the parent reads as a rule about cost REPORTS, so a driver mid-diagnosis
      # never recognizes it applies and hand-rolls a census off raw git output,
      # which ranks files the polluter filter already dropped
      - briefs/rule.forbid.adhoc-scope-rollups.md
      # say-level: fires the moment a prompt section order is declared or edited
      # — a one-line rank table, which is exactly where it looks harmless. the
      # decision procedure for the cache-anchor rule's first obligation: a small
      # volatile block ahead of large stable mass voids all of it, so the cost is
      # set by what sits BEHIND a section, never by its own size. measured here at
      # 22:1 in the wrong direction
      - briefs/rule.require.order-prompt-sections-by-volatility-then-size.md
      # say-level: generalizes the rule above. bytes shared by N requests of one
      # round lead bytes unique to one; stability is the second key, never the first
      - briefs/rule.require.order-prompt-bytes-by-reuse-breadth.md
      # say-level: fires the moment N concurrent requests share a prefix. fired
      # cold, all N miss; one poke first, then the pour, and N−1 read from cache
      - briefs/rule.require.prime-the-shared-prefix-before-a-pour.md
      # say-level: the forbid twins of the two rules above — a forbid names the
      # exact shape a reviewer can point at in a diff, so it bites first
      - briefs/rule.forbid.shared-bytes-behind-narrow-bytes.md
      - briefs/rule.forbid.cold-pour-of-a-shared-prefix.md
      # say-level: fires the moment a lock is about to be built. three hand-rolled locks
      # shipped here, each with its own crash rule, beside the org's own mutex package
      - briefs/rule.require.locks-via-with-simple-mutex.md
      - briefs/rule.forbid.hand-rolled-locks.md
      # say-level: fires the moment a loop over independent reviews is written.
      # a serial loop over partitions shipped with a header that argued for it
      - briefs/rule.forbid.serial-reviews-that-could-pour.md
      # say-level: fires the moment one review of a set fails. a throw that
      # discards the peer verdicts already paid for is the defect
      - briefs/rule.forbid.dropped-partial-review-progress.md
      # say-level: fires the moment a conversation read path is written or changed.
      # a faulted round's stdout rode whole into every later round's prompt
      - briefs/rule.forbid.verdictless-givens-whole-in-conversation.md

      # domain.terms - the repo's glossary intro + its org-wide governance, nested
      # under briefs/ so the boot loader pools it (it only pools files under
      # briefs/); booted for every role so all contracts obey one vocabulary.
      # only the lean readme + two rules ride say — a fixed, small footprint.
      # per-term files load on demand under ref, so the glossary grows without
      # bound while every boot stays a fixed size
      - briefs/domain.terms/.readme.md
      - briefs/domain.terms/rule.require.domain-term-itemization.md
      - briefs/domain.terms/rule.forbid.domain-term-synonyms.md

    ref:
      # domain.terms - every per-term cluster file, surfaced on demand so the boot
      # footprint stays fixed as the dictionary grows: the say-level choice (the
      # canonical word + forbidden synonyms) and its ref-level members (etymology,
      # disputes, evidence, examples). declared here explicitly, not left to the
      # <also> fallback, so a term stays discoverable under a scoped boot and the
      # boot globs stay testable. the always-booted readme points here
      - briefs/domain.terms/term=*._.choice._.md
      - briefs/domain.terms/term=*._.choice.reason.md
      - briefs/domain.terms/term=*._.choice.example=*.md

      # the externalization catalog — index over the en- family (enbrief ·
      # enskill · entool) plus pave + learn. ref: read once, when a traveler
      # asks which verb to reach for. was parked inside term=enbrief's reason
      # file, where the set was reachable only by a reader who knew a member
      - briefs/domain.terms/catalog.of=externalization._.md

      # the gap census — words this repo's glossary owes and does not hold.
      # ref: a backlog read at the moment a word is coined, and it is bhrain's
      # alone — at say it would charge every role's boot for a list only a
      # term-author reads. the .readme.md above points here
      - briefs/domain.terms/inventory.of=gaps._.md
      - briefs/domain.terms/gap=*.md

      # the glyph catalog — ref, not say: read once, when a glyph is claimed,
      # and it grows as axes are added. define.bhrain-repo-mascot rides say
      # and points here
      - briefs/domain.glyphs/catalog.of=glyph._.md
      - briefs/domain.glyphs/catalog.of=glyph.axis=*.md

      # lessons - load on demand
      - briefs/howto.acceptance-test-flow.[lesson].md
      - briefs/howto.acceptance-test-setup.[lesson].md
      - briefs/howto.acceptance.test.bdd.[lesson].md
      - briefs/howto.debug-tempdir-symlink-failures.[lesson].md
      - briefs/howto.detect-bound-route.[lesson].md
      - briefs/howto.diagnose-branch-failures.[lesson].md
      - briefs/howto.fast-cli-subpath.[lesson].md
      - briefs/howto.fast-skill-invocation.[lesson].md
      - briefs/howto.journey-tests-reveal-cache-bugs.[lesson].md
      - briefs/howto.rhachet.integration.[lesson].md
      - briefs/howto.test-skills-yourself.[lesson].md

      # hazards - load on demand. a hazard is a diagnosis, reached for when its
      # symptom shows; it does not need to fire before the mistake, because the
      # hook that catches the mistake already does
      - briefs/hazard.injected-date-disagrees-with-wallclock.md
      # differs from the hazard above: no hook catches it, and its failure is
      # silent and delayed (a build reverts the edit later). stays at ref
      # anyway — its cue table is what a reader reaches for on the symptom
      # "my change did not stick". a preToolUse hook would fire before the
      # edit; caught in .dream/
      - briefs/hazard.agent-brief-may-be-a-dist-symlink.md
      # peer of the hazard above — same src/ -> dist/ chain, opposite
      # direction. that one asks "is this .agent/ file safe to edit?"; this
      # one asks "does this citation ship?". invisible from inside this repo,
      # since every term path resolves on our disk and on no consumer's
      - briefs/hazard.published-brief-cannot-cite-the-repo-glossary.md
      # third hazard over the same .agent/ links, and the one whose symptom is
      # unmistakable: every tool refuses at once. ref rather than say, even so —
      # the refusal NAMES the cure's own command, so a reader who hits it is
      # already told where to look. what the brief adds is why the skill name
      # rotates between tools, which is the part that sends a traveler to wait
      # out a window that is not there
      - briefs/hazard.a-build-wipes-role-links-and-fails-every-hook-closed.md

      # research - load on demand
      - briefs/research.selfreview-effectiveness.md
      # what a peer review costs and why — the two answers behind `rhx review._.cost`.
      # ref: read once, when someone asks why the bill is what it is, or
      # before a change to the review prompt's section order
      - briefs/research.review-cost-and-cache.md

      # philosophy - load on demand. the why under the severity-tiered concede:
      # a budget balances perfection with pragmatism, so it is a maintenance
      # floor rather than a limit. ref, not say: it is the argument the two
      # role rules (driver + reviewer) cite, and it is read once, when a
      # severity is chosen
      - briefs/philosophy.a-review-budget-balances-perfection-with-pragmatism.md
