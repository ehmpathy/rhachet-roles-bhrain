always:
  briefs:
    say:
      - briefs/contract.reviewer-output.md
      - briefs/rule.forbid.overzealous-blockers.md
      # the same harm test, applied to a CONCESSION's severity: `urgent` is a
      # nameable shipped harm, `better` is every point that is not. say-level
      # beside overzealous-blockers because it reuses that rule's one test — so a
      # driver and a reviewer cannot reach opposite grades on one point, and the
      # budget hit's needs-a-human verdict rests on a grade both seats agree on
      - briefs/rule.require.grade-a-concession-by-its-harm.md
      # every concern the reviewer raises carries a strict [blocker|nitpick][urgent|better]
      # label — the harm axis beside the kind axis. the tallier reads the explicit label and
      # never infers urgent where the truth is better. say-level: it fires AT the moment a
      # concern is written, so it must be resident, not fetched
      - briefs/rule.require.label-each-concern-with-severity.md
      - briefs/review.tactics.md
      # partition through vertical domains, never through horizontal layers. say-level: it
      # fires AT the moment a partition is declared, and a layer is the cheapest cut to
      # type, so a fetched rule would arrive after the mistake
      - briefs/rule.require.vertical-partitions.md
      # its forbid peer: a ban on the horizontal shape bites where a call for the better one
      # slides by, so both are resident
      - briefs/rule.forbid.horizontal-partitions.md
      - briefs/on.rules/rules101.[article].md
      - briefs/on.rules/rules101.structure.[article].md
      - briefs/on.rules/rules101.content.[article].md
    ref:
      # the full behavior of --partition; review.tactics (say) carries the cue
      - briefs/howto.partition-an-overflowed-review.md
      - briefs/rule.forbid.overzealous-blockers.example=the-tidiness-blocker-and-the-false-green.md
      - briefs/on.rules/rules101.citations.[article].md
      - briefs/on.rules/rules101.collocated.[article].md
      - briefs/on.rules/rules101.content.[demo].forbid.failhide.md
      - briefs/on.rules/rules101.content.[demo].forbid.gerunds.md
      - briefs/on.rules/rules101.content.[demo].require.failfast.md
      - briefs/lessons/lesson.brain-selection-for-review.[finding].md
      - briefs/lessons/lesson.brain-software-vs-general.[finding].md
      - briefs/lessons/lesson.performance-singleturn-vs-multiturn.[finding].md
  skills:
    say:
      - skills/review.sh
      - skills/reflect.sh
