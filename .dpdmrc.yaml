# dpdm exclude patterns — each entry is joined with | into a single --exclude regex.
#
# an empty `exclude: []` means dpdm checks every file for cycles, node_modules included. this is
# the org policy `rule.forbid.dpdm-exclude-change`: we check dependencies too, because a prod-dep
# cycle ships to consumers.
#
# when an entry is allowed:
# - a type-only cycle: never. --transform erases type imports before analysis, so none is owed
# - a test file: never. the '!(*.test).ts' glob already drops test files
# - a require cycle inside a third-party devDependency: allowed, one entry per package, each with
#   a comment that cites the cycle and the upstream issue
# - a require cycle inside a prod dependency: never. it ships to consumers — dispatch the fix
#   upstream or replace the dependency
#
# an entry of `node_modules` (or dpdm's own `/node_modules/` default) disables the check across
# every consumer repo, and the declapract check rejects it.
#
# each entry names one package's store dir (`/<name>@`), so a peer package is never hidden.
exclude:
  # devDependencies — not shipped to consumers
  - /rhachet@ # dev + peer. enweaveOneStitcher.js <-> enweaveOne{Choice,Cycle,Fanout,Route}.js
  - /declastruct-aws@ # via rhachet. contract/sdks/index.js <-> getDeclastructAwsProvider.js
  - /@aws-sdk\+ # via declastruct-aws. STSClient.js <-> httpAuthSchemeProvider.js; resolveProfileData.js <-> resolveAssumeRoleCredentials.js

  # 🟡 prod dependencies — a held exception, fulcrum F4 of route v2026_11_19.declapract.upgrade.
  #    the org cycles (helpful-errors 1.5, domain-objects 0.31) are gone: package.json pins every
  #    transitive copy to the clean release via pnpm overrides. the two left sit in third-party
  #    packages with no clean release. each line names its fix; drop it once that lands.
  - /bottleneck@ # 2.19.5 is the last release. Bottleneck.js <-> Group.js. via wrapper-fns + @ehmpathy/as-command (both latest still pin it). dispatched to both owners
  - /readable-stream@ # 2.3.8 + 4.7.0 (latest). _stream_duplex.js <-> _stream_{readable,writable}.js. via archiver (captureSnapshot zip). replace: a zip writer on node:stream
